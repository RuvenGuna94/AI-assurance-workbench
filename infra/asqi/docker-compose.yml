networks:
  asqi-network:
    driver: bridge

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asqi
      POSTGRES_DB: asqi_starter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - asqi-network

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    environment:
      - LOG_LEVEL=debug
    networks:
      - asqi-network

volumes:
  pgdata:
