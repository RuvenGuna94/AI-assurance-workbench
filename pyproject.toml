[project]
name = "aiassuranceworkbench"
version = "0.1.0"
description = "Local AI assurance workbench using ASQI Engineer, Garak, Ollama and FastAPI"
readme = "README.md"
authors = [
    { name = "Ruven Guna" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_gateway"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
